<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Successful</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #e8f5e9; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .success-card { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; }
        .icon { font-size: 80px; color: #00c853; margin-bottom: 20px; }
        .btn-login { background: #002244; color: white; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-weight: bold; display: inline-block; margin-top: 20px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="success-card">
        <i class="fas fa-check-circle icon"></i>
        <h1 style="color:#002244;">Admission Successful!</h1>
        <p style="font-size:18px; color:#555; margin-top:10px;">Thank you for your payment.</p>
        <p>Your Student ID has been generated.</p>
        
        <a href="login.html" class="btn-login">Go to Student Login</a>
    </div>

<!-- SECURITY SCRIPT: Disable Right Click & Inspect -->
<script>
    // 1. Disable Right Click
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // 2. Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
    document.onkeydown = function(e) {
        if (e.keyCode == 123) { // F12
            return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { // Ctrl+Shift+I
            return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { // Ctrl+Shift+J
            return false;
        }
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U (View Source)
            return false;
        }
    };
</script>
</body>
</html>
